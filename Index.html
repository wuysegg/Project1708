<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bảo vệ Mật Khẩu</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- KHO ÂM THANH -->
    <audio id="sfx-genshin" src="assets/genshin.mp3"></audio>
    <audio id="bgm" src="assets/Purple_Lofi.mp3" loop></audio> <!-- Đổi tên file Lofi của bạn vào đây -->
    <audio id="sfx-type" src="assets/type.mp3"></audio>
    <!-- Vì dùng chung 1 file error sound, bạn cứ trỏ cùng 1 source cũng được, JS sẽ tự tua đúng giây -->
    <audio id="sfx-pass-wrong" src="assets/error_sound.mp3"></audio>
    <audio id="sfx-cap-wrong" src="assets/error_sound.mp3"></audio>
    <audio id="sfx-pass-right" src="assets/correct_sound.mp3"></audio>
    <audio id="sfx-cap-right" src="assets/correct_sound.mp3"></audio>

    <!-- MÀN HÌNH TRẮNG MỞ ĐẦU -->
    <div id="startup-overlay">
        <h1 class="startup-greeting">Xin chào, Hân của anh... 🤍</h1>
        <button id="start-btn">Nhấn để bắt đầu</button>
        <div id="time-counter" style="display: none;"></div>
    </div>

    <div class="stars-bg"></div>
    <!-- HIỆU ỨNG SAO BĂNG -->
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <!-- MÀN HÌNH CHÀO & NHẬP MẬT KHẨU -->
    <section id="welcome-screen">
        <div class="content-wrapper">
            <div class="cat-wrapper">
                <div id="cat-dialogue" class="undertale-speech"></div>
                <img src="assets/meo.png" id="cat" class="cat-image" alt="Cat">
            </div>
        
            <div class="pass-wrapper">
                <input type="password" id="pass-input" placeholder="nhập mật khẩu" readonly>
            </div>
            
            <div class="numpad">
                <button class="num-btn">1</button>
                <button class="num-btn">2</button>
                <button class="num-btn">3</button>
                <button class="num-btn">4</button>
                <button class="num-btn">5</button>
                <button class="num-btn">6</button>
                <button class="num-btn">7</button>
                <button class="num-btn">8</button>
                <button class="num-btn">9</button>
                <button class="num-btn action-btn" id="delete-btn">⌫</button>
                <button class="num-btn">0</button>
                <button class="num-btn action-btn enter-btn" id="enter-btn">↵</button>
            </div>
        </div>
    </section>

    <!-- OVERLAY CAPTCHA -->
    <div id="captcha-overlay" class="captcha-overlay" style="display: none;">
        <div class="captcha-box">
            <div class="captcha-progress">
                <div class="progress-bar-item pink" id="prog-0"></div>
                <div class="progress-bar-item pink" id="prog-1"></div>
                <div class="progress-bar-item pink" id="prog-2"></div>
                <div class="progress-bar-item pink" id="prog-3"></div>
                <div class="progress-bar-item pink" id="prog-4"></div>
            </div>

            <div class="captcha-header">
                <span class="captcha-title">XÁC MINH KHÔNG PHẢI ROBOT</span>
            </div>

            <div class="captcha-cat-container">
                <div class="captcha-cat-wrapper">
                    <img id="captcha-cat-img" src="assets/meo.png" alt="Cat Mini" />
                </div>
                <div id="captcha-dialogue" class="captcha-dialogue-box"></div>
            </div>

            <div id="captcha-options" class="captcha-options-container"></div>
        </div>
    </div>

    <div id="fade-transition" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #010113; z-index: 10000; opacity: 0; pointer-events: none;"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
