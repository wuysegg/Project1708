<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
</head>
    </head>
    <body>
        <!-- MÀN HÌNH CHÀO -->
        <section id="welcome-screen">
            <div class="content-wrapper">
                <div class="cat-wrapper">
                    <div id="cat-dialogue" class="undertale-speech"></div>
                    <img src="/assets/meo.png" id="cat" class="cat-image">
                </div>
            
                <input type="password" id="pass-input" placeholder="nhập mật khẩu" readonly>
                
                <div class="numpad">
                    <button class="num-btn">1</button>
                    <button class="num-btn">2</button>
                    <button class="num-btn">3</button>
                    <button class="num-btn">4</button>
                    <button class="num-btn">5</button>
                    <button class="num-btn">6</button>
                    <button class="num-btn">7</button>
                    <button class="num-btn">8</button>
                    <button class="num-btn">9</button>
                    <button class="num-btn action-btn" id="delete-btn">⌫</button>
                    <button class="num-btn">0</button>
                    <button class="num-btn action-btn enter-btn" id="enter-btn">↵</button>
                </div>
            </div>
            <!-- OVERLAY BAN ĐẦU ĐỂ LÀM MỜ MÀN HÌNH -->
            <div id="captcha-overlay" class="captcha-overlay" style="display: none;">
                <!-- BOX POPUP XÁC MINH ROBOT -->
                <div class="captcha-box">
                    <!-- Tiến trình 5 vạch -->
                    <div class="captcha-progress">
                        <div class="progress-bar-item pink" id="prog-0"></div>
                        <div class="progress-bar-item pink" id="prog-1"></div>
                        <div class="progress-bar-item pink" id="prog-2"></div>
                        <div class="progress-bar-item pink" id="prog-3"></div>
                        <div class="progress-bar-item pink" id="prog-4"></div>
                    </div>

                    <div class="captcha-header">
                    <span class="captcha-title">XÁC MINH KHÔNG PHẢI ROBOT</span>
            </div>

            <!-- Mèo mini ở góc trái box + Bóng thoại -->
            <div class="captcha-cat-container">
            <div class="captcha-cat-wrapper">
                <img id="captcha-cat-img" src="/assets/meo.png" alt="Cat Mini" />
            </div>
            <div id="captcha-dialogue" class="captcha-dialogue-box">
                <!-- Nội dung câu hỏi sẽ được gõ ở đây -->
            </div>
        </div>

        <!-- Danh sách các lựa chọn đáp án trắc nghiệm -->
        <div id="captcha-options" class="captcha-options-container">
            <!-- Tự động sinh ra bằng JS -->
        </div>
        </div>
        </div>
        </section>
    
        <!-- HIỆU ỨNG CHÍNH (Cây & Ảnh) -->
        <section id="main-gift" style="display: none;">
            <div class="grass-field"></div>
            <svg id="tree-svg">...</svg> <!-- Cây bự -->
            <div class="photo-gallery">
                <div class="photo-item"><img src="photo1.jpg"></div>
                <!-- Các ảnh khác -->
            </div>
            <button id="skip-btn">Skip</button>
        </section>
    
        <!-- LỚP PHỦ KẾT THÚC (Cánh hoa & Lời chúc) -->
        <section id="final-screen" style="display: none;">
            <div id="petal-container"></div> <!-- Nơi các cánh hoa sẽ xếp thành chữ -->
            <div class="final-message"></div>
            <img id="final-bg-image" src="photo_first_date.jpg">
        </section>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
